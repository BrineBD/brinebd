<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brine BD - Premium Clothing</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f5f5; }
        .error-bar {
            background: #ff4444; color: white; padding: 1rem; text-align: center;
            font-weight: bold; display: none;
        }
        header {
            background: #1a1a2e; color: white; padding: 1rem;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.8rem; font-weight: bold; color: #e94560; }
        .cart-icon {
            position: relative; cursor: pointer; font-size: 1.8rem;
            background: none; border: none; color: white;
        }
        .cart-count {
            position: absolute; top: -10px; right: -10px;
            background: #e94560; color: white; border-radius: 50%;
            padding: 0.2rem 0.5rem; font-size: 0.8rem;
        }
        .category-nav {
            display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1rem;
            justify-content: center; background: white; border-bottom: 1px solid #ddd;
        }
        .cat-btn {
            padding: 0.5rem 1.2rem; border-radius: 20px;
            border: 1px solid #e94560; background: white; color: #e94560;
            cursor: pointer; transition: 0.2s;
        }
        .cat-btn.active { background: #e94560; color: white; }
        .products {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem; padding: 2rem; max-width: 1200px; margin: 0 auto;
        }
        .product-card {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s;
            display: flex; flex-direction: column;
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-img {
            width: 100%; height: 250px; object-fit: cover;
            background: #eee;
        }
        .product-info { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
        .product-name { font-weight: bold; margin-bottom: 0.3rem; }
        .product-category { color: #666; font-size: 0.9rem; }
        .price { font-size: 1.2rem; color: #e94560; margin: 0.5rem 0; }
        .old-price { text-decoration: line-through; color: #999; font-size: 0.9rem; margin-left: 0.5rem; }
        .badge {
            background: #e94560; color: white; padding: 0.2rem 0.5rem;
            border-radius: 4px; font-size: 0.8rem; display: inline-block;
            margin-bottom: 0.5rem; align-self: flex-start;
        }
        .size-select { margin: 0.5rem 0; padding: 0.3rem; width: 100%; }
        .add-to-cart {
            margin-top: auto; padding: 0.7rem; background: #e94560; color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .add-to-cart:hover { opacity: 0.9; }

        /* Admin panel */
        #admin-panel {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200; justify-content: center;
            align-items: center; flex-direction: column;
        }
        #admin-inner {
            background: white; padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px;
            max-height: 80vh; overflow-y: auto;
        }
        #admin-inner input, #admin-inner select, #admin-inner button {
            width: 100%; padding: 0.7rem; margin: 0.5rem 0; border-radius: 8px;
            border: 1px solid #ddd;
        }
        #admin-inner button { background: #e94560; color: white; cursor: pointer; border: none; }
        .admin-toggle { color: white; background: none; border: none; display: none; }
        .close-admin { float: right; background: none; border: none; font-size: 1.5rem; cursor: pointer; }

        /* Cart modal */
        #cart-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 150; justify-content: center;
            align-items: center;
        }
        #cart-inner {
            background: white; padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px;
            max-height: 80vh; overflow-y: auto;
        }
        .cart-item { display: flex; justify-content: space-between; margin: 0.5rem 0; align-items: center; }
        .checkout-btn { width: 100%; padding: 0.8rem; background: #25D366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
    </style>
</head>
<body>
    <!-- ERROR DISPLAY BAR -->
    <div id="error-bar" class="error-bar"></div>

    <header>
        <div class="logo">BRINE BD</div>
        <button class="cart-icon" onclick="openCart()">🛒 <span class="cart-count" id="cart-count">0</span></button>
    </header>

    <div class="category-nav" id="cat-nav"></div>
    <div class="products" id="products-container"></div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <div id="admin-inner">
            <button class="close-admin" onclick="closeAdmin()">✖</button>
            <h3>🔐 Admin Panel</h3>
            <div id="admin-login">
                <input type="password" id="admin-pass" placeholder="Password">
                <button onclick="adminLogin()">Login</button>
            </div>
            <div id="admin-dashboard" style="display:none">
                <h4>Add New Product</h4>
                <input type="text" id="p-name" placeholder="Product Name">
                <select id="p-cat">
                    <option>Football Jersey</option>
                    <option>T-Shirt</option>
                    <option>Polo</option>
                    <option>Hoodie</option>
                    <option>Pants/Shorts</option>
                    <option>Jacket</option>
                </select>
                <input type="number" id="p-price" placeholder="Price (৳)">
                <input type="number" id="p-oldprice" placeholder="Old Price (optional)">
                <input type="text" id="p-badge" placeholder="Badge (e.g. NEW)">
                <label>Sizes: (comma separated)</label>
                <input type="text" id="p-sizes" placeholder="S,M,L,XL,XXL">
                <input type="file" id="p-image" accept="image/*">
                <button onclick="addProduct()">Add Product</button>
                <hr>
                <h4>Delete Product</h4>
                <input type="number" id="del-id" placeholder="Product ID">
                <button onclick="deleteProduct()">Delete</button>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal">
        <div id="cart-inner">
            <h3>🛒 Your Cart</h3>
            <div id="cart-items"></div>
            <hr>
            <h4>Customer Info</h4>
            <input type="text" id="cust-name" placeholder="Your Name">
            <input type="text" id="cust-phone" placeholder="Phone Number">
            <textarea id="cust-address" placeholder="Address" rows="2"></textarea>
            <button class="checkout-btn" onclick="placeOrder()">📱 Order via WhatsApp</button>
            <button onclick="closeCart()" style="background: #ccc; margin-top:0.5rem;">Close</button>
        </div>
    </div>

    <script>
        // ==================== ERROR DISPLAY HELPER ====================
        function showError(msg) {
            const bar = document.getElementById('error-bar');
            bar.textContent = '⚠️ ' + msg;
            bar.style.display = 'block';
        }

        // ==================== SUPABASE SETUP ====================
        const SUPABASE_URL = "https://nlsfcjsgxjlikwlyyzcu.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sc2ZjanNneGpsaWt3bHl5emN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MzA1ODcsImV4cCI6MjA5NjUwNjU4N30.HdNF-qAVdqVGhD2DjXjw0JmKosIofhbsAck_IgMrGYc";

        let supabase;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            showError('Supabase init error: ' + e.message);
        }

        // ==================== STATE ====================
        let products = [];
        let cart = [];
        let activeCategory = 'All';
        const categories = ['All', 'Football Jersey', 'T-Shirt', 'Polo', 'Hoodie', 'Pants/Shorts', 'Jacket'];
        const ADMIN_PASSWORD = 'brine2026';

        // ==================== FETCH PRODUCTS ====================
        async function loadProducts() {
            if (!supabase) {
                showError('Supabase client not initialized.');
                return;
            }
            try {
                const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
                if (error) {
                    showError('Supabase fetch error: ' + error.message + ' (code: ' + error.code + ')');
                    return;
                }
                products = data;
                document.getElementById('error-bar').style.display = 'none'; // hide error if success
                renderCategoryNav();
                renderProducts();
            } catch (err) {
                showError('Unexpected error: ' + err.message);
            }
        }

        function renderCategoryNav() {
            const nav = document.getElementById('cat-nav');
            nav.innerHTML = categories.map(cat =>
                `<button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
            ).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategoryNav();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            const filtered = activeCategory === 'All' ? products : products.filter(p => p.category === activeCategory);
            if (filtered.length === 0) {
                container.innerHTML = '<p>No products yet. Add via Admin Panel (Ctrl+Shift+A).</p>';
                return;
            }
            container.innerHTML = filtered.map(p => {
                const sizes = p.sizes && p.sizes.length ? p.sizes : ['S','M','L','XL'];
                const badge = p.badge ? `<span class="badge">${p.badge}</span>` : '';
                const oldPrice = p.old_price ? `<span class="old-price">৳${p.old_price}</span>` : '';
                const image = p.image_url || 'https://via.placeholder.com/300x300?text=No+Image';
                return `
                <div class="product-card">
                    <img class="product-img" src="${image}" alt="${p.name}" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x300?text=No+Image'">
                    <div class="product-info">
                        ${badge}
                        <div class="product-name">${p.name}</div>
                        <div class="product-category">${p.category}</div>
                        <div class="price">৳${p.price} ${oldPrice}</div>
                        <select class="size-select" id="size-${p.id}">
                            ${sizes.map(s => `<option>${s}</option>`).join('')}
                        </select>
                        <button class="add-to-cart" onclick="addToCart(${p.id})">Add to Cart 🛒</button>
                    </div>
                </div>`;
            }).join('');
        }

        // ==================== CART ====================
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            const sizeSelect = document.getElementById(`size-${productId}`);
            const size = sizeSelect ? sizeSelect.value : 'M';
            cart.push({ ...product, size });
            updateCartUI();
            alert(`"${product.name}" (${size}) added to cart!`);
        }

        function updateCartUI() {
            document.getElementById('cart-count').textContent = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = cart.map((item, i) => `
                <div class="cart-item">
                    <span>${item.name} (${item.size}) - ৳${item.price}</span>
                    <button onclick="removeFromCart(${i})" style="color:red;background:none;border:none;cursor:pointer;">✖</button>
                </div>
            `).join('');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function openCart() {
            document.getElementById('cart-modal').style.display = 'flex';
            updateCartUI();
        }

        function closeCart() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function placeOrder() {
            if (cart.length === 0) return alert('Cart is empty!');
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            if (!name || !phone) return alert('Please enter name and phone number.');

            let orderText = `🛍️ *New Order from Brine BD*%0A`;
            cart.forEach((item, i) => {
                orderText += `%0A${i+1}. ${item.name} (${item.size}) - ৳${item.price}`;
            });
            const total = cart.reduce((sum, item) => sum + Number(item.price), 0);
            orderText += `%0A%0A💰 Total: ৳${total}%0A%0A👤 Name: ${name}%0A📞 Phone: ${phone}%0A📍 Address: ${address}`;
            const waLink = `https://wa.me/8801835655675?text=${orderText}`;
            window.open(waLink, '_blank');
            cart = [];
            updateCartUI();
            closeCart();
        }

        // ==================== ADMIN ====================
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'A') {
                e.preventDefault();
                document.getElementById('admin-panel').style.display = 'flex';
            }
        });

        function closeAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('admin-login').style.display = 'block';
            document.getElementById('admin-dashboard').style.display = 'none';
        }

        function adminLogin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
            } else {
                alert('Wrong password!');
            }
        }

        async function addProduct() {
            const name = document.getElementById('p-name').value.trim();
            const category = document.getElementById('p-cat').value;
            const price = document.getElementById('p-price').value;
            const old_price = document.getElementById('p-oldprice').value || null;
            const badge = document.getElementById('p-badge').value || null;
            const sizesStr = document.getElementById('p-sizes').value;
            const imageFile = document.getElementById('p-image').files[0];

            if (!name || !price) return alert('Name and price required!');

            const sizes = sizesStr ? sizesStr.split(',').map(s => s.trim()) : [];
            let image_url = null;

            if (imageFile) {
                const fileName = `${Date.now()}_${imageFile.name}`;
                const { data, error } = await supabase.storage
                    .from('product-images')
                    .upload(fileName, imageFile, { cacheControl: '3600', upsert: false });
                if (error) { alert('Image upload failed: ' + error.message); return; }
                const { data: urlData } = supabase.storage.from('product-images').getPublicUrl(fileName);
                image_url = urlData.publicUrl;
            }

            const { error } = await supabase.from('products').insert({
                name,
                category,
                price: Number(price),
                old_price: old_price ? Number(old_price) : null,
                badge,
                sizes,
                image_url
            });
            if (error) { alert('Error adding product: ' + error.message); return; }
            alert('Product added!');
            ['p-name','p-price','p-oldprice','p-badge','p-sizes'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('p-image').value = '';
            loadProducts();
        }

        async function deleteProduct() {
            const id = document.getElementById('del-id').value;
            if (!id) return alert('Enter Product ID');
            if (!confirm(`Delete product ID ${id}?`)) return;
            const { data: prod } = await supabase.from('products').select('image_url').eq('id', id).single();
            if (prod && prod.image_url) {
                const path = prod.image_url.split('/').pop();
                await supabase.storage.from('product-images').remove([path]);
            }
            const { error } = await supabase.from('products').delete().eq('id', id);
            if (error) { alert('Delete failed: ' + error.message); return; }
            alert('Product deleted!');
            document.getElementById('del-id').value = '';
            loadProducts();
        }

        // ==================== INITIAL LOAD ====================
        loadProducts();
    </script>
</body>
</html>
